<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HITS Incentive Tracker &mdash; Offline</title>
  <link rel="stylesheet" href="colors_and_type.css?v=20260929a" />
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; background: var(--sd-bg-app); }
    body {
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      padding: 24px; font-family: var(--sd-font-sans, system-ui, sans-serif);
      color: var(--sd-text-1, #1b1f2a);
    }
    .card {
      max-width: 460px; width: 100%; text-align: center;
      background: var(--sd-bg-surface, #fff); border-radius: 16px;
      padding: 40px 32px; box-shadow: 0 1px 3px rgba(16,24,40,.08), 0 8px 28px rgba(16,24,40,.06);
    }
    img { width: 120px; margin-bottom: 28px; }
    h1 { font-size: 20px; line-height: 1.35; margin: 0 0 12px; font-weight: 600; }
    p  { font-size: 14px; line-height: 1.6; margin: 0 0 8px; color: var(--sd-text-2, #5a6172); }
    .note { margin-top: 24px; font-size: 13px; color: var(--sd-text-3, #868da0); }
  </style>
</head>
<body>
  <div class="card">
    <img src="shopdeck-logo.svg" alt="ShopDeck" />
    <h1>The HITS Incentive Tracker is temporarily offline</h1>
    <p>The tracker has been taken down while the incentive structure is being updated.</p>
    <p class="note">Please reach out to the HITS business team for the latest incentive numbers.</p>
  </div>
</body>
</html>
